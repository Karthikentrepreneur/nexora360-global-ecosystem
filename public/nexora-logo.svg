<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="320" height="80">
  <defs>
    <radialGradient id="n360_globe" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#259BF5" />
      <stop offset="45%" stop-color="#0875C9" />
      <stop offset="85%" stop-color="#064E8A" />
      <stop offset="100%" stop-color="#042C52" />
    </radialGradient>
    <linearGradient id="n360_roy" x1="0%" y1="20%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="30%" stop-color="#EF4444" />
      <stop offset="65%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="n360_text_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <filter id="n360_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM -->
  <g transform="translate(10, 5)">
    <!-- Back orbit -->
    <ellipse cx="35" cy="35" rx="32" ry="13" transform="rotate(-28 35 35)" stroke="url(#n360_roy)" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="3 4" />
    <!-- Globe Core -->
    <circle cx="35" cy="35" r="22" fill="url(#n360_globe)" filter="drop-shadow(0 4px 10px rgba(8, 117, 201, 0.4))" />
    <!-- Globe Grids -->
    <g opacity="0.65" stroke="#FFFFFF" stroke-width="0.75">
      <ellipse cx="35" cy="35" rx="21.5" ry="7.5" />
      <ellipse cx="35" cy="28" rx="18" ry="5.5" opacity="0.7" />
      <ellipse cx="35" cy="42" rx="18" ry="5.5" opacity="0.7" />
      <ellipse cx="35" cy="35" rx="9" ry="21.5" />
      <circle cx="35" cy="35" r="21.5" fill="none" stroke="#60A5FA" stroke-width="0.5" opacity="0.6" />
    </g>
    <!-- Connected Data Nodes -->
    <circle cx="41" cy="33" r="2" fill="#FACC15" filter="url(#n360_glow)" />
    <circle cx="24" cy="30" r="1.5" fill="#FFFFFF" />
    <circle cx="33" cy="26" r="1.5" fill="#F97316" />
    <circle cx="46" cy="29" r="1.5" fill="#EF4444" />
    <path d="M24 30 L33 26 L41 33 L46 29" stroke="#FACC15" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.85" />
    <!-- Dynamic 360° Ribbon -->
    <path d="M 6 44 C 14 55, 54 55, 65 30 C 68 22, 62 13, 50 11" stroke="url(#n360_roy)" stroke-width="2.8" stroke-linecap="round" fill="none" filter="url(#n360_glow)" />
    <circle cx="64" cy="31" r="2.8" fill="#FACC15" filter="url(#n360_glow)" />
    <circle cx="64" cy="31" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- LOGO TEXT -->
  <text x="86" y="44" font-family="'Manrope', 'Inter', system-ui, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">NEXORA</text>
  <text x="206" y="44" font-family="'Manrope', 'Inter', system-ui, sans-serif" font-weight="900" font-size="28" fill="url(#n360_text_grad)" letter-spacing="-0.5">360</text>
  <text x="88" y="62" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9" fill="#0875C9" letter-spacing="3.5">GLOBAL</text>
  <circle cx="150" cy="59" r="1.5" fill="#F97316" />
  <text x="160" y="62" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="9" fill="#94A3B8" letter-spacing="2.8">SOLUTIONS</text>
</svg>
